# Render Blueprint - backend + Redis only.
# Frontend is on Vercel (https://prompt-lab-gold.vercel.app); Postgres is on Neon.
# https://render.com/docs/blueprint-spec

services:
  # Backend API (https://promptlab-c3mb.onrender.com)
  - type: web
    name: promptlab
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false  # Neon connection string, set in Render dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: promptlab-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard
      - key: FRONTEND_URL
        value: https://prompt-lab-gold.vercel.app
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW
        value: "3600"

  # Redis Cache (rate limiting)
  - type: keyvalue
    name: promptlab-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # internal connections only
